<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="description" content="ニュースや一般知識を調べて、図を交えて分かりやすくまとめたページ">
<title>Knowledge Space</title>
<link rel="icon" href="data:,">
<style>
/* 配色は役割名で定義し、本文と図は役割名だけを参照する。白背景のライト固定 */
:root {
  color-scheme: light;
  --page: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4f4f1;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6b6a65;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.12);
  --link: #006300;
  --series-1: #008300;
  --series-2: #6250d6;
  --series-3: #eda100;
  --callout: #e8f3e8;
  --accent: #008300; /* 見出し・罫線・強調の共通色（図の色とは別の役割） */
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.85;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.site-header { border-bottom: 1px solid var(--border); background: var(--surface); }
.site-header .wrap { padding-top: 12px; padding-bottom: 12px; }
.site-name { color: var(--ink); font-weight: 700; text-decoration: none; letter-spacing: 0.02em; }
.site-footer { margin-top: 64px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
.site-footer .wrap { padding-top: 20px; padding-bottom: 40px; }

main { padding-top: 32px; }
.page-head { margin-bottom: 28px; }
.eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
h1 { margin: 0 0 12px; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.4; }
main { counter-reset: section; }
main > h2,
.sources > h2 {
  counter-increment: section;
  margin: 80px 0 20px;
  padding-top: 20px;
  border-top: 3px solid var(--accent);
  font-size: 26px;
  line-height: 1.5;
}
main > h2::before,
.sources > h2::before {
  content: counter(section, decimal-leading-zero);
  display: block;
  margin-bottom: 2px;
  color: var(--accent);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
h3 {
  margin: 40px 0 10px;
  padding-left: 12px;
  border-left: 4px solid var(--accent);
  font-size: 18px;
  line-height: 1.5;
}
.card h3 { margin: 0 0 6px; padding-left: 0; border-left: 0; }
.summary { margin: 0 0 8px; color: var(--ink-2); max-width: 44rem; }
.meta { margin: 0; color: var(--muted); font-size: 13px; }
p, li { max-width: 44rem; }
ul, ol { padding-left: 1.4em; }
li { margin: 4px 0; }

.lede {
  margin: 24px 0;
  padding: 18px 20px;
  background: var(--callout);
  border-radius: 8px;
}
.lede h2 { margin: 0 0 8px; font-size: 17px; }
.lede p { margin: 8px 0 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 24px 0; }
.stat { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.stat-value { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; }
.stat-value small { font-size: 14px; font-weight: 600; }
.stat-label { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.6; }

figure.viz { margin: 28px 0; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.viz-title { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.viz-sub { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.viz-scroll { overflow-x: auto; }
.viz svg { display: block; width: 100%; height: auto; font-family: inherit; }
figcaption { margin-top: 12px; color: var(--ink-2); font-size: 13px; line-height: 1.7; max-width: none; }

.viz svg text { fill: var(--ink-2); font-size: 12px; }
.viz svg .t-ink { fill: var(--ink); }
.viz svg .t-strong { fill: var(--ink); font-weight: 700; font-size: 13px; }
.viz svg .t-muted { fill: var(--muted); }
.viz svg .t-small { font-size: 11px; }
.viz svg .grid { stroke: var(--grid); stroke-width: 1; }
.viz svg .axis { stroke: var(--axis); stroke-width: 1.5; }
.viz svg .arrow { stroke: var(--ink-2); stroke-width: 1.5; fill: none; }
.viz svg .arrowhead { fill: var(--ink-2); }
.viz svg .mask { fill: var(--surface); }
.viz svg .box { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1; }
.viz svg .box-key { fill: var(--surface-2); stroke: var(--series-1); stroke-width: 1.5; }
.viz svg .mk-period { fill: var(--series-1); }
.viz svg .mk-found { fill: var(--series-2); }
.viz svg .mk-announce { fill: var(--ink); }
.viz svg .mk-advisory { fill: var(--series-3); }
.viz svg .bar { fill: var(--series-1); }
.viz svg .dot-case { fill: var(--series-2); }

.table-wrap { overflow-x: auto; margin: 20px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.7; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
caption { caption-side: bottom; padding-top: 8px; color: var(--muted); font-size: 12px; text-align: left; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 16px 0; }
.card { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.card h3 { margin: 0 0 6px; font-size: 16px; }
.card p, .card ul { margin: 6px 0 0; font-size: 14px; line-height: 1.75; }
.card ul { padding-left: 1.2em; }
.tag { display: inline-block; margin-right: 6px; padding: 0 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; color: var(--ink-2); font-size: 12px; }
.note { padding: 12px 16px; background: var(--surface-2); border-radius: 8px; color: var(--ink-2); font-size: 14px; }
.note p { margin: 4px 0; }

details { margin: 12px 0; }
summary { cursor: pointer; color: var(--link); font-size: 14px; }
dl.terms { margin: 12px 0; }
dl.terms dt { margin-top: 12px; font-weight: 700; }
dl.terms dd { margin: 2px 0 0; color: var(--ink-2); max-width: 44rem; }

.sources li { font-size: 14px; }
.sources .date { color: var(--muted); font-size: 12px; }

.index-list { list-style: none; padding: 0; margin: 20px 0; display: grid; gap: 12px; }
.index-list li { max-width: none; margin: 0; }
.index-card { display: block; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: inherit; text-decoration: none; }
.index-card:hover { border-color: var(--accent); }
.index-card h2 { margin: 4px 0 6px; font-size: 18px; }
.index-card p { margin: 0; color: var(--ink-2); font-size: 14px; }

@media (max-width: 600px) {
  body { font-size: 15px; }
  main > h2, .sources > h2 { margin-top: 56px; font-size: 22px; }
  figure.viz { padding: 12px; }
  .viz-wide { min-width: 640px; }
  .viz-mid { min-width: 560px; }
}

</style>
</head>
